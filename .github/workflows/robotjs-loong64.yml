name: robotjs-loong64

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译构建 (loong64)
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 QEMU（loong64 模拟）
      uses: docker/setup-qemu-action@v4

    - name: 在龙芯容器中编译
      run: |
        docker run --platform linux/loong64 \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          linuxdeepin/deepin:crimson-loong64-v1.6.0 \
          bash -c '
            set -e

            apt update && apt upgrade -y
            apt install -y build-essential python3 python3-setuptools ca-certificates curl xz-utils make libxtst-dev
            curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v22.21.1/node-v22.21.1-linux-loong64.tar.xz" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            node -v
            npm -v

            # 1) 全量依赖：sqlite3 走 N-API 对 Node 22.21.1 编译，headers 官方存在
            npm install --foreground-scripts

            npm install -g node-gyp
            npm install @jitsi/robotjs@0.6.13 --no-save --no-audit --no-fund

            cd node_modules/@jitsi/robotjs
            node-gyp rebuild --release --force_build=1
            cd /workspace
          '

    - name: 上传构建产物
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robotjs-loong64
        path: node_modules/
        if-no-files-found: error
