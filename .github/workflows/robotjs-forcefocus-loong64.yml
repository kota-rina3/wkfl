name: robotjs-forcefocus-loong64

on:
  workflow_dispatch:
    branch: master

jobs:
  build:
    name: 编译构建 (loong64)
    runs-on: ubuntu-latest

    steps:
    - name: 检查代码
      uses: actions/checkout@v4

    - name: 设置 QEMU（loong64 模拟）
      uses: docker/setup-qemu-action@v4

    - name: 在 deepin-loong64 容器中编译
      run: |
        docker run --platform linux/loong64 \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          linuxdeepin/deepin:crimson-loong64-v1.6.0 \
          bash -c '
            set -e
            apt update && apt upgrade -y
            apt install -y build-essential python3 python3-setuptools ca-certificates curl xz-utils cmake \
              libx11-dev libxtst-dev libxinerama-dev libxrandr-dev libpng-dev
            curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v22.21.1/node-v22.21.1-linux-loong64.tar.xz" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            node -v
            npm -v
            npm install -g node-gyp@12.2.0

            npm install robotjs@0.6.0 --build-from-source
            npm install forcefocus@1.1.0 --build-from-source
            
          '

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: robotjs-forcefocus-loong64
        path: ./