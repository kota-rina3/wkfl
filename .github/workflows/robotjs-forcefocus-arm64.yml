name: robotjs-forcefocus-arm64

on:
  workflow_dispatch:
    branch: master

jobs:
  build:
    name: 编译构建
    runs-on: ubuntu-latest
    container: linuxdeepin/deepin:crimson-arm64-v1.6.0

    steps:
    - name: 检查代码
      uses: actions/checkout@v4

    - name: 安装所需依赖
      run: |
        apt update && apt upgrade -y
        apt install -y build-essential python3 python3-setuptools ca-certificates curl xz-utils cmake \
          libx11-dev libxtst-dev libxinerama-dev libxrandr-dev libpng-dev
        curl -fsSL "https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz" -o /tmp/node.tar.xz
        tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
        node -v
        npm -v
        npm install -g node-gyp@12.2.0

    - name: 安装并编译模块
      continue-on-error: false
      run: |
        npm install robotjs@0.6.0 --build-from-source
        npm install forcefocus@1.1.0 --build-from-source

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: robotjs-forcefocus-arm64
        path: ./
